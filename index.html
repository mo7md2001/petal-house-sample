let lang='ar',cat='all',cart=[];
const $=id=>document.getElementById(id);
function tr(k){return T[lang][k]}
function money(n){return n+' '+tr('cur')}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
 for(const k of ['bar','logo','badge','h1','sub','shop','exT','cT','buy','note','foot'])$(k).textContent=tr(k);
 $('lang').textContent=lang=='ar'?'English':'عربي';
 $('nm').placeholder=tr('nm');$('ph').placeholder=tr('ph');$('ad').placeholder=tr('ad');
 $('cartBtn').textContent=tr('cart')+' ('+cart.length+')';
 $('cats').innerHTML=['all',...new Set(P.map(p=>p.c))].map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${c}';render()">${c=='all'?tr('all'):tr('c_'+c)}</button>`).join('');
 $('grid').innerHTML=P.filter(p=>cat=='all'||p.c==cat).map(p=>`<div class="card"><div class="pic"><img src="${IMG[p.id]}" alt="${p.en}"></div><div class="info"><b>${p[lang]}</b><small>${p['d'+lang]}</small><div class="row"><span class="price">${money(p.p)}</span><button onclick="add(${p.id})">${tr('buyNow')}</button></div></div></div>`).join('');
 const ex=T.extras;$('ex').innerHTML=ex.map((x,i)=>`<label><input type="checkbox" id="x${i}" onchange="upd()" ${window['xs'+i]?'checked':''}> ${x[lang]} (+${x.p})</label>`).join('');
 upd();
}
let extrasOn={};
function upd(){
 T.extras.forEach((x,i)=>{const el=$('x'+i);if(el)extrasOn[i]=el.checked});
 let sum=cart.reduce((s,p)=>s+p.p,0)+(cart.length?T.extras.reduce((s,x,i)=>s+(extrasOn[i]?x.p:0),0):0);
 $('lines').innerHTML=cart.map(p=>`<div class="li"><span>${p[lang]}</span><span>${money(p.p)}</span></div>`).join('')||`<p>${tr('empty')}</p>`;
 $('tot').textContent=tr('total')+': '+money(sum);
}
function add(id){cart.push(P.find(p=>p.id==id));$('panel').classList.add('open');render()}
$('lang').onclick=()=>{lang=lang=='ar'?'en':'ar';render()};

$('shop').onclick=()=>$('grid').scrollIntoView({behavior:'smooth'});
$('buy').onclick=()=>{const t=$('toast');t.textContent=tr('demo');t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
render();
</script></body></html>
